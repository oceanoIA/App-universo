<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNIVERSE — Interactive Space Explorer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      position: relative;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(0, 170, 255, 0.035), transparent 45%),
        #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.7s ease;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-inner {
      width: min(420px, 80vw);
    }

    .loading-title {
      font-size: 11px;
      letter-spacing: 0.35em;
      color: rgba(255,255,255,0.9);
      margin-bottom: 16px;
    }

    .loading-bar {
      width: 100%;
      height: 1px;
      background: rgba(255,255,255,0.12);
      overflow: hidden;
    }

    .loading-progress {
      width: 0%;
      height: 100%;
      background: #65dfff;
      transition: width 0.3s ease;
    }

    .loading-status {
      margin-top: 10px;
      font-size: 9px;
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.38);
    }

    /* =========================
       TOP BAR
    ========================= */

    .topbar {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-mark {
      width: 8px;
      height: 8px;
      border: 1px solid #8cecff;
      box-shadow: 0 0 12px rgba(100,220,255,0.7);
    }

    .brand-text {
      font-size: 12px;
      letter-spacing: 0.28em;
      font-weight: 500;
    }

    .status {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 9px;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.5);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #66e8ff;
      box-shadow: 0 0 12px #66e8ff;
    }

    /* =========================
       LEFT NAV
    ========================= */

    .left-panel {
      position: fixed;
      z-index: 20;
      left: 26px;
      top: 50%;
      transform: translateY(-50%);
      width: 150px;
      pointer-events: none;
    }

    .nav-label {
      font-size: 8px;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.3);
      margin-bottom: 12px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav button {
      pointer-events: auto;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-left: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.2);
      color: rgba(255,255,255,0.48);
      text-align: left;
      font-size: 9px;
      letter-spacing: 0.16em;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .nav button:hover,
    .nav button.active {
      color: #fff;
      border-left-color: #66e8ff;
      background: rgba(70,210,255,0.055);
    }

    /* =========================
       SEARCH
    ========================= */

    .search {
      position: fixed;
      z-index: 20;
      top: 88px;
      right: 28px;
      width: 230px;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.18);
    }

    .search-icon {
      width: 12px;
      height: 12px;
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 50%;
      margin-right: 9px;
      position: relative;
    }

    .search-icon::after {
      content: "";
      position: absolute;
      width: 5px;
      height: 1px;
      background: rgba(255,255,255,0.45);
      right: -4px;
      bottom: -2px;
      transform: rotate(45deg);
    }

    .search input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      padding: 9px 0;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .search input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    /* =========================
       OBJECT INFO
    ========================= */

    #objectInfo {
      position: fixed;
      z-index: 21;
      right: 28px;
      bottom: 130px;
      width: 260px;
      padding: 17px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(2,4,7,0.72);
      backdrop-filter: blur(12px);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: 0.25s ease;
    }

    #objectInfo.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .object-type {
      font-size: 8px;
      color: #69e7ff;
      letter-spacing: 0.22em;
      margin-bottom: 7px;
    }

    .object-name {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.05em;
      margin-bottom: 13px;
    }

    .object-description {
      font-size: 10px;
      line-height: 1.65;
      color: rgba(255,255,255,0.5);
    }

    .focus-btn {
      margin-top: 15px;
      width: 100%;
      padding: 9px;
      border: 1px solid rgba(100,220,255,0.35);
      background: rgba(70,210,255,0.04);
      color: #9eefff;
      font-size: 8px;
      letter-spacing: 0.18em;
      cursor: pointer;
    }

    .focus-btn:hover {
      background: rgba(70,210,255,0.1);
    }

    /* =========================
       AI PANEL
    ========================= */

    #aiPanel {
      position: fixed;
      z-index: 30;
      right: 28px;
      bottom: 28px;
      width: min(360px, calc(100vw - 56px));
      border: 1px solid rgba(255,255,255,0.11);
      background: rgba(2,4,7,0.8);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 50px rgba(0,0,0,0.5);
    }

    .ai-header {
      height: 43px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .ai-title {
      font-size: 9px;
      letter-spacing: 0.2em;
    }

    .ai-state {
      font-size: 7px;
      letter-spacing: 0.15em;
      color: #66e8ff;
    }

    #chat {
      height: 160px;
      overflow-y: auto;
      padding: 13px;
      scrollbar-width: thin;
    }

    .message {
      margin-bottom: 11px;
      font-size: 10px;
      line-height: 1.55;
    }

    .message.ai {
      color: rgba(255,255,255,0.65);
    }

    .message.user {
      color: #9eefff;
      text-align: right;
    }

    .message-label {
      display: block;
      font-size: 7px;
      letter-spacing: 0.18em;
      opacity: 0.35;
      margin-bottom: 3px;
    }

    .ai-input {
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .ai-input input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: 10px;
    }

    .ai-input input::placeholder {
      color: rgba(255,255,255,0.22);
    }

    .ai-input button {
      width: 52px;
      border: 0;
      border-left: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: #76eaff;
      cursor: pointer;
      font-size: 9px;
      letter-spacing: 0.1em;
    }

    .ai-input button:hover {
      background: rgba(100,220,255,0.06);
    }

    /* =========================
       TIME CONTROL
    ========================= */

    .time-panel {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: min(460px, calc(100vw - 60px));
      pointer-events: none;
    }

    .time-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .time-label,
    #timeValue {
      font-size: 8px;
      letter-spacing: 0.17em;
      color: rgba(255,255,255,0.35);
    }

    #timeSlider {
      width: 100%;
      height: 2px;
      appearance: none;
      background: rgba(255,255,255,0.12);
      outline: none;
      pointer-events: auto;
    }

    #timeSlider::-webkit-slider-thumb {
      appearance: none;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #70eaff;
      box-shadow: 0 0 10px rgba(100,230,255,0.8);
      cursor: pointer;
    }

    /* =========================
       HINT
    ========================= */

    .hint {
      position: fixed;
      z-index: 10;
      left: 50%;
      top: 82%;
      transform: translateX(-50%);
      font-size: 8px;
      letter-spacing: 0.17em;
      color: rgba(255,255,255,0.2);
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .hint.hidden {
      opacity: 0;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 700px) {
      .topbar {
        padding: 0 18px;
      }

      .left-panel {
        left: 15px;
        top: auto;
        bottom: 105px;
        transform: none;
        width: 115px;
      }

      .nav button {
        padding: 8px;
        font-size: 7px;
      }

      .search {
        top: 76px;
        right: 18px;
        width: 180px;
      }

      #objectInfo {
        right: 18px;
        bottom: 280px;
        width: 220px;
      }

      #aiPanel {
        right: 18px;
        bottom: 18px;
      }

      .time-panel {
        bottom: 220px;
        width: 220px;
      }

      .hint {
        display: none;
      }
    }
  </style>

  <!--
    IMPORT MAP:
    questo risolve il problema di OrbitControls che cerca
    "three" come modulo.
  -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

  <div id="app"></div>

  <!-- LOADING -->
  <div id="loading">
    <div class="loading-inner">
      <div class="loading-title">UNIVERSE SYSTEM</div>

      <div class="loading-bar">
        <div id="loadingProgress" class="loading-progress"></div>
      </div>

      <div id="loadingStatus" class="loading-status">
        INITIALIZING SPACE ENGINE
      </div>
    </div>
  </div>

  <!-- TOP -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">UNIVERSE</div>
    </div>

    <div class="status">
      <div class="status-dot"></div>
      <span>SYSTEM ONLINE</span>
    </div>
  </div>

  <!-- LEFT NAV -->
  <div class="left-panel">
    <div class="nav-label">NAVIGATION</div>

    <div class="nav">
      <button class="active" data-mode="system">SYSTEM</button>
      <button data-mode="planets">PLANETS</button>
      <button data-mode="moons">MOONS</button>
      <button data-mode="stars">STARS</button>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search">
    <div class="search-wrap">
      <div class="search-icon"></div>
      <input
        id="searchInput"
        type="text"
        autocomplete="off"
        placeholder="SEARCH CELESTIAL OBJECT"
      />
    </div>
  </div>

  <!-- OBJECT INFO -->
  <div id="objectInfo">
    <div id="objectType" class="object-type">OBJECT</div>
    <div id="objectName" class="object-name">—</div>
    <div id="objectDescription" class="object-description"></div>
    <button id="focusButton" class="focus-btn">
      FOCUS OBJECT
    </button>
  </div>

  <!-- AI -->
  <div id="aiPanel">

    <div class="ai-header">
      <div class="ai-title">COSMOS AI</div>
      <div id="aiState" class="ai-state">READY</div>
    </div>

    <div id="chat">
      <div class="message ai">
        <span class="message-label">COSMOS AI</span>
        Sistema online. Puoi chiedermi informazioni su pianeti, lune, stelle e spazio.
      </div>
    </div>

    <div class="ai-input">
      <input
        id="aiInput"
        type="text"
        autocomplete="off"
        placeholder="ASK ABOUT THE UNIVERSE..."
      />

      <button id="sendAI">SEND</button>
    </div>

  </div>

  <!-- TIME -->
  <div class="time-panel">

    <div class="time-top">
      <span class="time-label">SIMULATION TIME</span>
      <span id="timeValue">CURRENT</span>
    </div>

    <input
      id="timeSlider"
      type="range"
      min="0"
      max="1000"
      value="500"
    />

  </div>

  <div id="hint" class="hint">
    DRAG TO ROTATE · SCROLL TO ZOOM · CLICK OBJECT TO INSPECT
  </div>


  <script type="module">

    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";


    /* =========================================================
       BASIC SETUP
    ========================================================= */

    const app = document.getElementById("app");

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0x000000);


    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      100000
    );

    camera.position.set(0, 30, 75);


    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;

    app.appendChild(renderer.domElement);


    /* =========================================================
       CONTROLS
    ========================================================= */

    const controls = new OrbitControls(
      camera,
      renderer.domElement
    );

    controls.enableDamping = true;
    controls.dampingFactor = 0.055;

    controls.minDistance = 2;
    controls.maxDistance = 3000;

    controls.rotateSpeed = 0.45;
    controls.zoomSpeed = 0.7;


    /* =========================================================
       LIGHT
    ========================================================= */

    const ambientLight = new THREE.AmbientLight(
      0xffffff,
      0.06
    );

    scene.add(ambientLight);


    /* =========================================================
       STAR FIELD
    ========================================================= */

    function createStars() {

      const count = 14000;

      const positions = new Float32Array(count * 3);

      const sizes = new Float32Array(count);

      for (let i = 0; i < count; i++) {

        const radius =
          700 +
          Math.random() * 2300;

        const theta =
          Math.random() * Math.PI * 2;

        const phi =
          Math.acos(
            2 * Math.random() - 1
          );

        positions[i * 3] =
          radius *
          Math.sin(phi) *
          Math.cos(theta);

        positions[i * 3 + 1] =
          radius *
          Math.cos(phi);

        positions[i * 3 + 2] =
          radius *
          Math.sin(phi) *
          Math.sin(theta);

        sizes[i] =
          Math.random() *
          1.8 +
          0.3;
      }


      const geometry =
        new THREE.BufferGeometry();

      geometry.setAttribute(
        "position",
        new THREE.BufferAttribute(
          positions,
          3
        )
      );


      const material =
        new THREE.PointsMaterial({
          color: 0xffffff,
          size: 1.2,
          transparent: true,
          opacity: 0.8,
          sizeAttenuation: true
        });


      const stars =
        new THREE.Points(
          geometry,
          material
        );

      scene.add(stars);

      return stars;
    }

    const stars = createStars();


    /* =========================================================
       CELESTIAL DATA
    ========================================================= */

    const planetData = {

      Mercury: {
        type: "PLANET",
        radius: 1.0,
        distance: 11,
        speed: 0.047,
        color: 0x8c8077,
        description:
          "Il pianeta più vicino al Sole. Ha una superficie rocciosa e una forte escursione termica."
      },

      Venus: {
        type: "PLANET",
        radius: 1.45,
        distance: 16,
        speed: 0.035,
        color: 0xd8a76b,
        description:
          "Un pianeta roccioso avvolto da una densa atmosfera ricca di anidride carbonica."
      },

      Earth: {
        type: "PLANET",
        radius: 1.55,
        distance: 22,
        speed: 0.029,
        color: 0x3d7ec7,
        description:
          "Il nostro pianeta, con oceani liquidi, atmosfera e una Luna naturale."
      },

      Mars: {
        type: "PLANET",
        radius: 1.18,
        distance: 29,
        speed: 0.024,
        color: 0xb85636,
        description:
          "Il pianeta rosso. La sua superficie presenta vulcani, canyon e antichi letti fluviali."
      },

      Jupiter: {
        type: "PLANET",
        radius: 4.3,
        distance: 40,
        speed: 0.013,
        color: 0xc89b72,
        description:
          "Il gigante gassoso più grande del Sistema Solare."
      },

      Saturn: {
        type: "PLANET",
        radius: 3.65,
        distance: 53,
        speed: 0.010,
        color: 0xd8bd88,
        description:
          "Un gigante gassoso famoso per il suo vasto sistema di anelli."
      },

      Uranus: {
        type: "PLANET",
        radius: 2.5,
        distance: 65,
        speed: 0.007,
        color: 0x77d4d6,
        description:
          "Un gigante ghiacciato con una caratteristica inclinazione dell'asse."
      },

      Neptune: {
        type: "PLANET",
        radius: 2.45,
        distance: 77,
        speed: 0.005,
        color: 0x3d68d0,
        description:
          "Il pianeta più esterno degli otto pianeti principali del Sistema Solare."
      }

    };


    const moonData = {

      Moon: {
        parent: "Earth",
        radius: 0.42,
        distance: 3,
        speed: 0.12,
        color: 0xb9b9b9,
        description:
          "Il satellite naturale della Terra."
      },

      Io: {
        parent: "Jupiter",
        radius: 0.45,
        distance: 6,
        speed: 0.18,
        color: 0xd5a95c,
        description:
          "Una delle lune galileiane di Giove e uno dei corpi più vulcanicamente attivi conosciuti."
      },

      Europa: {
        parent: "Jupiter",
        radius: 0.39,
        distance: 7.5,
        speed: 0.14,
        color: 0xd5d0b8,
        description:
          "Una luna ghiacciata di Giove con una superficie attraversata da numerose fratture."
      },

      Ganymede: {
        parent: "Jupiter",
        radius: 0.65,
        distance: 9,
        speed: 0.10,
        color: 0x99958c,
        description:
          "La più grande luna del Sistema Solare."
      },

      Callisto: {
        parent: "Jupiter",
        radius: 0.58,
        distance: 11,
        speed: 0.075,
        color: 0x77716b,
        description:
          "Una grande luna di Giove con una superficie ricca di crateri."
      }

    };


    /* =========================================================
       SUN
    ========================================================= */

    const sunGeometry =
      new THREE.SphereGeometry(
        6,
        48,
        48
      );

    const sunMaterial =
      new THREE.MeshBasicMaterial({
        color: 0xffc15c
      });

    const sun =
      new THREE.Mesh(
        sunGeometry,
        sunMaterial
      );

    sun.userData = {
      name: "Sun",
      type: "STAR",
      description:
        "La stella al centro del Sistema Solare. La sua gravità mantiene i pianeti nelle loro orbite."
    };

    scene.add(sun);


    const sunLight =
      new THREE.PointLight(
        0xffffff,
        3,
        500
      );

    scene.add(sunLight);


    /* =========================================================
       PLANETS
    ========================================================= */

    const planets = {};

    const selectableObjects = [];

    function createPlanet(
      name,
      data
    ) {

      const geometry =
        new THREE.SphereGeometry(
          data.radius,
          32,
          32
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: data.color,
          roughness: 0.82,
          metalness: 0.02
        });

      const mesh =
        new THREE.Mesh(
          geometry,
          material
        );

      mesh.userData = {
        name,
        type: data.type,
        description: data.description,
        radius: data.radius,
        distance: data.distance
      };

      scene.add(mesh);

      planets[name] = mesh;

      selectableObjects.push(mesh);


      /* ORBIT */

      const orbitGeometry =
        new THREE.RingGeometry(
          data.distance - 0.025,
          data.distance + 0.025,
          256
        );

      const orbitMaterial =
        new THREE.MeshBasicMaterial({
          color: 0x6fdfff,
          transparent: true,
          opacity: 0.12,
          side: THREE.DoubleSide
        });

      const orbit =
        new THREE.Mesh(
          orbitGeometry,
          orbitMaterial
        );

      orbit.rotation.x =
        Math.PI / 2;

      scene.add(orbit);


      /* SATURN RINGS */

      if (name === "Saturn") {

        const ringGeometry =
          new THREE.RingGeometry(
            data.radius * 1.4,
            data.radius * 2.25,
            96
          );

        const ringMaterial =
          new THREE.MeshBasicMaterial({
            color: 0xb8a986,
            transparent: true,
            opacity: 0.48,
            side: THREE.DoubleSide
          });

        const rings =
          new THREE.Mesh(
            ringGeometry,
            ringMaterial
          );

        rings.rotation.x =
          Math.PI * 0.38;

        mesh.add(rings);
      }

      return mesh;
    }


    Object.entries(
      planetData
    ).forEach(
      ([name, data]) => {
        createPlanet(
          name,
          data
        );
      }
    );


    /* =========================================================
       MOONS
    ========================================================= */

    const moons = [];

    function createMoon(
      name,
      data
    ) {

      const geometry =
        new THREE.SphereGeometry(
          data.radius,
          20,
          20
        );

      const material =
        new THREE.MeshStandardMaterial({
          color: data.color,
          roughness: 0.95
        });

      const moon =
        new THREE.Mesh(
          geometry,
          material
        );

      moon.userData = {
        name,
        type: "MOON",
        description: data.description
      };

      scene.add(moon);

      moons.push({
        mesh: moon,
        data
      });

      selectableObjects.push(moon);
    }


    Object.entries(
      moonData
    ).forEach(
      ([name, data]) => {
        createMoon(
          name,
          data
        );
      }
    );


    /* =========================================================
       RAYCASTING
    ========================================================= */

    const raycaster =
      new THREE.Raycaster();

    const mouse =
      new THREE.Vector2();

    let selectedObject = null;


    function updateMouse(
      event
    ) {

      mouse.x =
        (event.clientX /
          window.innerWidth) *
          2 -
        1;

      mouse.y =
        -(event.clientY /
          window.innerHeight) *
          2 +
        1;
    }


    function selectObject(
      object
    ) {

      if (!object) return;

      selectedObject =
        object;

      const info =
        document.getElementById(
          "objectInfo"
        );

      document.getElementById(
        "objectType"
      ).textContent =
        object.userData.type ||
        "OBJECT";

      document.getElementById(
        "objectName"
      ).textContent =
        object.userData.name ||
        "UNKNOWN";

      document.getElementById(
        "objectDescription"
      ).textContent =
        object.userData.description ||
        "No information available.";

      info.classList.add(
        "visible"
      );
    }


    window.addEventListener(
      "pointerdown",
      (event) => {

        if (
          event.target.closest(
            "button,input"
          )
        ) {
          return;
        }

        updateMouse(event);

        raycaster.setFromCamera(
          mouse,
          camera
        );

        const hits =
          raycaster.intersectObjects(
            selectableObjects,
            false
          );

        if (hits.length > 0) {

          selectObject(
            hits[0].object
          );

        } else {

          document
            .getElementById(
              "objectInfo"
            )
            .classList.remove(
              "visible"
            );
        }
      }
    );


    /* =========================================================
       FOCUS
    ========================================================= */

    document
      .getElementById(
        "focusButton"
      )
      .addEventListener(
        "click",
        () => {

          if (!selectedObject) {
            return;
          }

          const target =
            selectedObject.position;

          const distance =
            selectedObject.userData.radius
              ? selectedObject.userData.radius * 5
              : 8;

          const direction =
            new THREE.Vector3(
              1,
              0.5,
              1
            ).normalize();

          camera.position.copy(
            target.clone().add(
              direction.multiplyScalar(
                distance
              )
            )
          );

          controls.target.copy(
            target
          );

          controls.update();
        }
      );


    /* =========================================================
       SEARCH
    ========================================================= */

    const searchInput =
      document.getElementById(
        "searchInput"
      );


    searchInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key !== "Enter"
        ) {
          return;
        }

        const query =
          searchInput.value
            .trim()
            .toLowerCase();

        if (!query) return;


        const allObjects = [
          sun,
          ...selectableObjects
        ];

        const found =
          allObjects.find(
            object =>
              object.userData.name
                ?.toLowerCase()
                .includes(query)
          );

        if (found) {

          selectObject(found);

          const target =
            found.position;

          camera.position.set(
            target.x + 8,
            target.y + 4,
            target.z + 8
          );

          controls.target.copy(
            target
          );

          controls.update();
        }
      }
    );


    /* =========================================================
       NAVIGATION
    ========================================================= */

    const navButtons =
      document.querySelectorAll(
        ".nav button"
      );


    navButtons.forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            navButtons.forEach(
              b =>
                b.classList.remove(
                  "active"
                )
            );

            button.classList.add(
              "active"
            );

            const mode =
              button.dataset.mode;

            if (
              mode === "system"
            ) {

              camera.position.set(
                0,
                30,
                75
              );

              controls.target.set(
                0,
                0,
                0
              );

            }

            if (
              mode === "planets"
            ) {

              camera.position.set(
                0,
                25,
                55
              );

              controls.target.set(
                0,
                0,
                25
              );

            }

            if (
              mode === "moons"
            ) {

              const earth =
                planets.Earth;

              if (earth) {

                camera.position.set(
                  0,
                  7,
                  12
                );

                controls.target.copy(
                  earth.position
                );
              }
            }

            if (
              mode === "stars"
            ) {

              camera.position.set(
                0,
                100,
                220
              );

              controls.target.set(
                0,
                0,
                0
              );
            }

            controls.update();
          }
        );
      }
    );


    /* =========================================================
       TIME
    ========================================================= */

    const timeSlider =
      document.getElementById(
        "timeSlider"
      );

    const timeValue =
      document.getElementById(
        "timeValue"
      );

    let simulationSpeed = 1;


    timeSlider.addEventListener(
      "input",
      () => {

        const value =
          Number(
            timeSlider.value
          );

        simulationSpeed =
          value / 250;

        if (
          simulationSpeed < 0.05
        ) {
          simulationSpeed = 0.05;
        }

        timeValue.textContent =
          `${simulationSpeed.toFixed(2)}×`;
      }
    );


    /* =========================================================
       COSMOS AI
    ========================================================= */

    const chat =
      document.getElementById(
        "chat"
      );

    const aiInput =
      document.getElementById(
        "aiInput"
      );

    const sendAI =
      document.getElementById(
        "sendAI"
      );

    const aiState =
      document.getElementById(
        "aiState"
      );


    function addMessage(
      text,
      type
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        `message ${type}`;

      const label =
        document.createElement(
          "span"
        );

      label.className =
        "message-label";

      label.textContent =
        type === "user"
          ? "USER"
          : "COSMOS AI";

      message.appendChild(
        label
      );

      const content =
        document.createElement(
          "span"
        );

      content.textContent =
        text;

      message.appendChild(
        content
      );

      chat.appendChild(
        message
      );

      chat.scrollTop =
        chat.scrollHeight;
    }


    function localAI(
      question
    ) {

      const q =
        question.toLowerCase();


      if (
        q.includes("terra")
      ) {

        return (
          "La Terra è il terzo pianeta del Sistema Solare. " +
          "Il suo unico satellite naturale è la Luna."
        );
      }


      if (
        q.includes("luna")
      ) {

        return (
          "La Luna è il satellite naturale della Terra. " +
          "La sua gravità influenza anche le maree terrestri."
        );
      }


      if (
        q.includes("giove")
      ) {

        return (
          "Giove è il pianeta più grande del Sistema Solare. " +
          "Il sistema comprende anche le quattro lune galileiane: Io, Europa, Ganimede e Callisto."
        );
      }


      if (
        q.includes("saturno")
      ) {

        return (
          "Saturno è un gigante gassoso caratterizzato da un vasto sistema di anelli."
        );
      }


      if (
        q.includes("marte")
      ) {

        return (
          "Marte è un pianeta roccioso. " +
          "La sua superficie contiene vulcani, canyon e numerosi crateri."
        );
      }


      if (
        q.includes("sole")
      ) {

        return (
          "Il Sole è la stella al centro del Sistema Solare. " +
          "La sua gravità domina il movimento dei principali corpi del sistema."
        );
      }


      if (
        q.includes("mercurio")
      ) {

        return (
          "Mercurio è il pianeta più vicino al Sole e il più piccolo degli otto pianeti principali."
        );
      }


      if (
        q.includes("venere")
      ) {

        return (
          "Venere è un pianeta roccioso con un'atmosfera estremamente densa."
        );
      }


      if (
        q.includes("urano")
      ) {

        return (
          "Urano è un gigante ghiacciato caratterizzato da una forte inclinazione dell'asse di rotazione."
        );
      }


      if (
        q.includes("nettuno")
      ) ||
      q.includes("neptune") {

        return (
          "Nettuno è il pianeta più esterno degli otto pianeti principali del Sistema Solare."
        );
      }


      if (
        q.includes("universo")
      ) {

        return (
          "L'universo osservabile contiene un numero enorme di galassie, stelle, sistemi planetari e altri oggetti cosmici."
        );
      }


      if (
        selectedObject
      ) {

        return (
          `Stai osservando ${selectedObject.userData.name}. ` +
          selectedObject.userData.description
        );
      }


      return (
        "Posso analizzare gli oggetti presenti nell'esplorazione. " +
        "Prova a chiedermi qualcosa su Sole, Terra, Luna, Marte, Giove, Saturno o sulle altre lune."
      );
    }


    function askAI() {

      const question =
        aiInput.value.trim();

      if (!question) return;

      addMessage(
        question,
        "user"
      );

      aiInput.value = "";

      aiState.textContent =
        "THINKING";

      setTimeout(
        () => {

          const answer =
            localAI(question);

          addMessage(
            answer,
            "ai"
          );

          aiState.textContent =
            "READY";

        },
        450
      );
    }


    sendAI.addEventListener(
      "click",
      askAI
    );


    aiInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {
          askAI();
        }
      }
    );


    /* =========================================================
       ANIMATION
    ========================================================= */

    const clock =
      new THREE.Clock();

    let elapsed = 0;


    function animate() {

      requestAnimationFrame(
        animate
      );

      const delta =
        clock.getDelta();

      elapsed +=
        delta * simulationSpeed;


      /* STAR ROTATION */

      stars.rotation.y +=
        delta * 0.003;


      /* PLANETS */

      Object.entries(
        planetData
      ).forEach(
        ([name, data]) => {

          const planet =
            planets[name];

          if (!planet) {
            return;
          }

          const angle =
            elapsed *
            data.speed;

          planet.position.x =
            Math.cos(angle) *
            data.distance;

          planet.position.z =
            Math.sin(angle) *
            data.distance;

          planet.rotation.y +=
            delta * 0.25;
        }
      );


      /* MOONS */

      moons.forEach(
        ({ mesh, data }) => {

          const parent =
            planets[data.parent];

          if (!parent) {
            return;
          }

          const angle =
            elapsed *
            data.speed;

          mesh.position.x =
            parent.position.x +
            Math.cos(angle) *
            data.distance;

          mesh.position.y =
            parent.position.y +
            Math.sin(angle * 0.7) *
            data.distance *
            0.15;

          mesh.position.z =
            parent.position.z +
            Math.sin(angle) *
            data.distance;

          mesh.rotation.y +=
            delta * 0.5;
        }
      );


      /* SUN */

      sun.rotation.y +=
        delta * 0.08;


      controls.update();

      renderer.render(
        scene,
        camera
      );
    }


    /* =========================================================
       RESIZE
    ========================================================= */

    window.addEventListener(
      "resize",
      () => {

        camera.aspect =
          window.innerWidth /
          window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
          window.innerWidth,
          window.innerHeight
        );

        renderer.setPixelRatio(
          Math.min(
            window.devicePixelRatio,
            2
          )
        );
      }
    );


    /* =========================================================
       LOADING
    ========================================================= */

    const loading =
      document.getElementById(
        "loading"
      );

    const loadingProgress =
      document.getElementById(
        "loadingProgress"
      );

    const loadingStatus =
      document.getElementById(
        "loadingStatus"
      );


    let progress = 0;


    const loadingTimer =
      setInterval(
        () => {

          progress +=
            Math.random() * 18;

          if (
            progress > 100
          ) {
            progress = 100;
          }

          loadingProgress.style.width =
            `${progress}%`;

          if (
            progress < 35
          ) {

            loadingStatus.textContent =
              "INITIALIZING SPACE ENGINE";

          } else if (
            progress < 65
          ) {

            loadingStatus.textContent =
              "BUILDING CELESTIAL MAP";

          } else if (
            progress < 90
          ) {

            loadingStatus.textContent =
              "LOADING SOLAR SYSTEM";

          } else {

            loadingStatus.textContent =
              "SYSTEM READY";
          }

          if (
            progress >= 100
          ) {

            clearInterval(
              loadingTimer
            );

            setTimeout(
              () => {

                loading.classList.add(
                  "hidden"
                );

              },
              350
            );
          }

        },
        100
      );


    /* =========================================================
       START
    ========================================================= */

    animate();

  </script>

</body>
</html>
